<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Review Queue hero specimen</title><desc id="desc">Nine fixture rows reveal status, owner and next review time. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">REVIEW QUEUE</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><rect x="42" y="98" width="716" height="300" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="64" y="130" fill="#352C40" font-size="16" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Episode / review state</text><text x="580" y="130" fill="#352C40" font-size="16" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Owner</text><g class="stage s0"><text x="64" y="158" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-001</text><text x="220" y="158" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Completed</text><text x="580" y="158" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer A</text></g><g class="stage s1"><text x="64" y="183" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-002</text><text x="220" y="183" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">In review</text><text x="580" y="183" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer B</text></g><g class="stage s2"><text x="64" y="208" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-003</text><text x="220" y="208" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Abstained</text><text x="580" y="208" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer C</text></g><g class="stage s3"><text x="64" y="233" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-004</text><text x="220" y="233" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending</text><text x="580" y="233" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer A</text></g><g class="stage s0"><text x="64" y="258" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-005</text><text x="220" y="258" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending</text><text x="580" y="258" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer B</text></g><g class="stage s1"><text x="64" y="283" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-006</text><text x="220" y="283" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Completed</text><text x="580" y="283" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer C</text></g><g class="stage s2"><text x="64" y="308" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-007</text><text x="220" y="308" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Rejected flag</text><text x="580" y="308" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer A</text></g><g class="stage s3"><text x="64" y="333" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-008</text><text x="220" y="333" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending</text><text x="580" y="333" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer B</text></g><g class="stage s0"><text x="64" y="358" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">SYN-009</text><text x="220" y="358" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Abstained</text><text x="580" y="358" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer C</text></g><text x="44" y="430" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">9 synthetic episodes · counts are fixtures, not outcomes</text></svg>