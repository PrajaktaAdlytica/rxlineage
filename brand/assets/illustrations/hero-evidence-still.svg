<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Evidence hero specimen</title><desc id="desc">A source note aligns with an unmeasured evaluation field. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">EVIDENCE</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="44" y="110" width="330" height="255" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M348 110v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="64" y="146" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Published workflow context</text><text x="64" y="178" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">AHRQ MATCH</text><text x="64" y="205" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Cited process background</text><text x="64" y="232" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not RxLineage validation</text></g><g class="stage s1"><rect x="426" y="146" width="330" height="255" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M730 146v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="446" y="182" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Still to test</text><text x="446" y="214" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Sensitivity and missed cases</text><text x="446" y="241" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Precision and review burden</text><text x="446" y="268" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Buyer economics</text><rect x="447" y="344" width="136" height="27" rx="5" fill="#E4DDEB" stroke="none"/><text x="459" y="362" fill="#352C40" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not yet measured</text></g></svg>