<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Evaluation hero specimen</title><desc id="desc">Numbered prerequisites appear, all pending; stop rule remains visible. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">EVALUATION</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><text x="45" y="120" fill="#352C40" font-size="36" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">01</text><rect x="45" y="144" width="165" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="63" y="175" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">8 interviews</text><text x="63" y="201" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending prerequisite</text></g><path class="draw" d="M210 198H225V248H235" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s1"><text x="235" y="170" fill="#352C40" font-size="36" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">02</text><rect x="235" y="194" width="165" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="253" y="225" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Blinded review</text><text x="253" y="251" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending prerequisite</text></g><path class="draw" d="M400 248H415V198H425" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s2"><text x="425" y="120" fill="#352C40" font-size="36" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">03</text><rect x="425" y="144" width="165" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="443" y="175" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Champion</text><text x="443" y="201" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending prerequisite</text></g><path class="draw" d="M590 198H605V248H615" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s3"><text x="615" y="170" fill="#352C40" font-size="36" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">04</text><rect x="615" y="194" width="165" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="633" y="225" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Funded scope</text><text x="633" y="251" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pending prerequisite</text></g><text x="45" y="380" fill="#352C40" font-size="15" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Plus signed data-access, security and human-oversight approvals.</text><text x="45" y="412" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Stop if critical cases are missed or added precision is not worth effort.</text></svg>