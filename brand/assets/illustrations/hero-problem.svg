<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Problem hero specimen</title><desc id="desc">Scattered sources align while the unresolved gap remains visible. Synthetic concept only; no clinical action.</desc><style>.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">PROBLEM</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="50" y="155" width="220" height="176" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M244 155v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="70" y="191" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Reported list</text><text x="70" y="223" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Dated source</text><text x="70" y="250" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Context incomplete</text></g><g class="stage s1"><rect x="290" y="100" width="220" height="176" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M484 100v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="310" y="136" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Dated history</text><text x="310" y="168" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Dated source</text><text x="310" y="195" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Context incomplete</text></g><g class="stage s2"><rect x="530" y="185" width="220" height="176" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M724 185v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="550" y="221" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Prior note</text><text x="550" y="253" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Dated source</text><text x="550" y="280" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Context incomplete</text></g><g class="stage s3"><path class="draw" d="M150 331V385H650V361" fill="none" stroke="#80604C" stroke-width="1.7"/><text x="280" y="414" fill="#352C40" font-size="17" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="star