<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Page not found hero specimen</title><desc id="desc">A misfiled folio returns to its index; recovery links stay visible. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">PAGE NOT FOUND</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><text x="65" y="138" fill="#352C40" font-size="16" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">01</text><rect x="125" y="105" width="600" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="147" y="146" fill="#352C40" font-size="23" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Products</text></g><g class="stage s1"><text x="65" y="234" fill="#352C40" font-size="16" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">02</text><rect x="125" y="201" width="600" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="147" y="242" fill="#352C40" font-size="23" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Synthetic demo</text></g><g class="stage s2"><text x="65" y="330" fill="#352C40" font-size="16" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">03</text><rect x="125" y="297" width="600" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="147" y="338" fill="#352C40" font-size="23" font-weight="400" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Contact</text></g></svg>