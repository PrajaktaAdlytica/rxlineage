<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Evaluation method hero specimen</title><desc id="desc">Empty metric slots reveal with no fabricated results. Synthetic concept only; no clinical action.</desc><style>.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">EVALUATION METHOD</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="45" y="110" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="63" y="141" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Precision at K</text><text x="63" y="167" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not yet measured</text></g><g class="stage s1"><rect x="425" y="110" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="443" y="141" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Missed critical cases</text><text x="443" y="167" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not yet measured</text></g><g class="stage s2"><rect x="45" y="255" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="63" y="286" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">False-alert burden</text><text x="63" y="312" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not yet measured</text></g><g class="stage s3"><rect x="425" y="255" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="443" y="286" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Review time</text><text x="443" y="312" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Not yet measured</text></g><text x="45" y="425" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Define K, denominator, baseline and stop thresholds before evaluation.</text></svg>