<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-labelledby="title"><title id="title">RxLineage Evaluation mobile hero</title><style>.stage{animation:enter .6s ease both}.stage:nth-of-type(2){animation-delay:.2s}.stage:nth-of-type(3){animation-delay:.4s}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.stage{animation:none;opacity:1;transform:none}}svg[data-still="true"] .stage{animation:none;opacity:1;transform:none}svg[data-paused="true"] *{animation-play-state:paused!important}</style><rect width="400" height="700" rx="12" fill="#E4DDEB"/><text x="24" y="32" font-family="&quot;IBM Plex Mono&quot;,sans-serif" font-size="12" fill="#352C40">EVALUATION</text><text x="24" y="60" font-family="&quot;IBM Plex Mono&quot;,sans-serif" font-size="11" fill="#352C40">DEMO / SYNTHETIC DATA</text><text x="24" y="82" font-family="&quot;IBM Plex Mono&quot;,sans-serif" font-size="11" fill="#352C40">CONCEPT PREVIEW</text><g class="stage"><rect x="24" y="110" width="352" height="150" rx="5" fill="white" stroke="#D5CDD8"/><text x="42" y="142" font-family="&quot;Newsreader&quot;,sans-serif" font-size="22" fill="#352C40">Interviews and baseline</text><text x="42" y="175" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">8 pharmacist/director interviews</text><text x="42" y="203" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">Prespecified baseline window</text></g><path d="M200 260v32" stroke="#B28D76" stroke-width="2"/><g class="stage"><rect x="24" y="292" width="352" height="150" rx="5" fill="white" stroke="#D5CDD8"/><text x="42" y="324" font-family="&quot;Newsreader&quot;,sans-serif" font-size="22" fill="#352C40">Blinded review and champion</text><text x="42" y="357" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">Blinded-case review approval</text><text x="42" y="385" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">1 pharmacist champion</text></g><path d="M200 442v32" stroke="#B28D76" stroke-width="2"/><g class="stage"><rect x="24" y="474" width="352" height="150" rx="5" fill="white" stroke="#D5CDD8"/><text x="42" y="506" font-family="&quot;Newsreader&quot;,sans-serif" font-size="22" fill="#352C40">Funded and approved scope</text><text x="42" y="539" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">1 funded silent-mode scope</text><text x="42" y="567" font-family="&quot;Source Sans 3&quot;,sans-serif" font-size="16" fill="#352C40">Data, security, oversight approvals</text></g><text x="24" y="690" font-family="&quot;IBM Plex Mono&quot;,sans-serif" font-size="10" fill="#352C40">SYNTHETIC FIXTURE · NO MEASURED OUTCOME</text></svg>