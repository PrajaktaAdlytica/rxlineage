<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Uncertainty guide hero specimen</title><desc id="desc">Unknown and conflicting labels separate into distinct examples. Synthetic concept only; no clinical action.</desc><style>.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">UNCERTAINTY GUIDE</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="45" y="120" width="325" height="235" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M344 120v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="65" y="156" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Unknown</text><text x="65" y="188" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">A needed field is absent.</text><text x="65" y="215" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">No guessed answer.</text><rect x="66" y="284" width="171" height="27" rx="5" fill="#F2E5D3" stroke="none"/><text x="78" y="302" fill="#755327" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Insufficient evidence</text></g><g class="stage s1"><rect x="430" y="120" width="325" height="235" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M729 120v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="450" y="156" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Conflicting</text><text x="450" y="188" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Sources disagree.</text><text x="450" y="215" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Show both values.</text><rect x="451" y="284" width="171" height="27" rx="5" fill="#F4E3E7" stroke="none"/><text x="463" y="302" fill="#7D3D4C" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">For pharmacist review</text></g></svg>