<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Issue Review hero specimen</title><desc id="desc">Issue labels enter a review lane; a rejected flag remains visible. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">ISSUE REVIEW</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="52" y="110" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="70" y="141" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Duplicate concern</text><text x="70" y="167" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">For pharmacist adjudication</text></g><path class="draw" d="M332 145H395V245H458" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s1"><rect x="52" y="198" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="70" y="229" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Allergy information</text><text x="70" y="255" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">For pharmacist adjudication</text></g><path class="draw" d="M332 233H395V245H458" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s2"><rect x="52" y="286" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="70" y="317" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Dose issue</text><text x="70" y="343" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">For pharmacist adjudication</text></g><path class="draw" d="M332 321H395V245H458" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s3"><rect x="458" y="205" width="295" height="100" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="476" y="236" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Pharmacist disposition</text><text x="476" y="262" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Review / reject / keep unresolved</text><rect x="480" y="341" width="185" height="27" rx="5" fill="#E4DDEB" stroke="none"/><text x="492" y="359" fill="#352C40" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SYN-007 · flag rejected</text></g></svg>