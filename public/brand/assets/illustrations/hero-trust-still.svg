<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Governance hero specimen</title><desc id="desc">A permission boundary highlights source access and human review. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">GOVERNANCE</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><rect x="65" y="90" width="670" height="315" rx="18" fill="#FFFFFF" stroke="#887A8F"/><text x="92" y="129" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">REVIEW BOUNDARY</text><g class="stage s0"><rect x="100" y="160" width="600" height="61" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="118" y="191" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Synthetic preview</text><text x="118" y="217" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">No PHI / no live connections</text></g><g class="stage s1"><rect x="100" y="232" width="600" height="61" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="118" y="263" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Data access</text><text x="118" y="289" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Written rights and approval</text></g><g class="stage s2"><rect x="100" y="304" width="600" height="61" rx="8" fill="#FFFFFF" stroke="#D5CDD8"/><text x="118" y="335" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Human review</text><text x="118" y="361" fill="#675A70" font-size="13" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Named pharmacist owner</text></g></svg>