<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Audit Reports hero specimen</title><desc id="desc">Source, reviewer, disposition and override versions reveal in order. Synthetic concept only; no clinical action.</desc><style>.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#F4F1EA"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">AUDIT REPORTS</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><path class="draw" d="M80 114V366" fill="none" stroke="#80604C" stroke-width="1.7"/><g class="stage s0"><circle cx="80" cy="130" r="5" fill="#B28D76"/><text x="112" y="127" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">08:00</text><text x="238" y="127" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Sources received</text><text x="238" y="154" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SYN-001 · illustrative event</text></g><g class="stage s1"><circle cx="80" cy="235" r="5" fill="#B28D76"/><text x="112" y="232" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">09:10</text><text x="238" y="232" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reviewer A records disposition</text><text x="238" y="259" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SYN-001 · illustrative event</text></g><g class="stage s2"><circle cx="80" cy="340" r="5" fill="#B28D76"/><text x="112" y="337" fill="#352C40" font-size="13" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">09:20</text><text x="238" y="337" fill="#352C40" font-size="18" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Prior version retained</text><text x="238" y="364" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SYN-001 · illustrative event</text></g></svg>