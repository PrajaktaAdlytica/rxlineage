<svg data-still="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">RxLineage Home hero specimen</title><desc id="desc">Two histories enter; dates align; one difference opens an evidence drawer. Synthetic concept only; no clinical action.</desc><style>.draw{stroke-dashoffset:0!important}.stage{opacity:1!important;transform:none!important}.stage{animation:enter .7s cubic-bezier(.22,1,.36,1) both}.s1{animation-delay:.25s}.s2{animation-delay:.5s}.s3{animation-delay:.75s}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 2.3s .4s ease forwards}.focus-trace{animation:enter .18s both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.stage{opacity:1;transform:none}}svg[data-paused="true"] *{animation-play-state:paused!important}svg[data-still="true"] *{animation:none!important}.no-motion .draw{stroke-dashoffset:0}</style><rect width="800" height="480" rx="14" fill="#E4DDEB"/><text x="32" y="38" fill="#352C40" font-size="12" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">HOME</text><rect x="402" y="18" width="202" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="413" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">DEMO / SYNTHETIC DATA</text><rect x="614" y="18" width="154" height="27" rx="14" fill="none" stroke="#887A8F"/><text x="625" y="36" fill="#352C40" font-size="10" font-weight="400" font-family="&quot;IBM Plex Mono&quot;,sans-serif" text-anchor="start">CONCEPT PREVIEW</text><g class="stage s0"><rect x="42" y="98" width="298" height="235" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M314 98v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="62" y="134" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Reported history</text><text x="62" y="166" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SRC-002A · 12 Oct 08:20</text><text x="62" y="193" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Medication X</text><text x="62" y="220" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Reported current</text><rect x="62" y="281" width="80" height="27" rx="5" fill="#E4DDEB" stroke="none"/><text x="74" y="299" fill="#352C40" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Source A</text></g><g class="stage s1"><rect x="460" y="127" width="298" height="235" rx="4" fill="#FFFFFF" stroke="#D5CDD8"/><path class="draw" d="M732 127v26h26" fill="none" stroke="#D5CDD8" stroke-width="1.7"/><text x="480" y="163" fill="#352C40" font-size="20" font-weight="500" font-family="&quot;Newsreader&quot;,sans-serif" text-anchor="start">Dated pharmacy history</text><text x="480" y="195" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SRC-002B · 05 Oct 12:00</text><text x="480" y="222" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Medication X</text><text x="480" y="249" fill="#675A70" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Different recorded status</text><rect x="480" y="311" width="80" height="27" rx="5" fill="#E4DDEB" stroke="none"/><text x="492" y="329" fill="#352C40" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Source B</text></g><g class="stage s2"><path class="draw" d="M340 244H386V272H460" fill="none" stroke="#80604C" stroke-width="1.7"/><rect x="330" y="363" width="101" height="27" rx="5" fill="#F4E3E7" stroke="none"/><text x="342" y="381" fill="#7D3D4C" font-size="13" font-weight="600" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">Conflicting</text><text x="340" y="420" fill="#352C40" font-size="14" font-weight="400" font-family="&quot;Source Sans 3&quot;,sans-serif" text-anchor="start">SYN-002 · for pharmacist review</text></g></svg>